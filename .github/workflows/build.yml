name: Build EarShot

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Platform-independent tests of EarShotCore.h, with AddressSanitizer,
  # UndefinedBehaviourSanitizer and LeakSanitizer enabled.
  core-tests:
    name: Core unit tests (Linux, sanitizers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Locate core tests
        id: locate
        shell: bash
        run: |
          file=$(find . -name core_test.cpp -path '*EarShot/EarShot/tests/*' -not -path './.git/*' | head -n 1)
          if [ -z "$file" ]; then
            echo "::error::tests/core_test.cpp was not found in the repository."
            echo "Expected SOURCE/repo/EarShot/EarShot/tests/core_test.cpp relative to the repository root."
            echo "Repository tree (first 200 entries):"
            find . -not -path './.git*' | sort | head -n 200
            exit 1
          fi
          echo "dir=$(dirname "$file")" >> "$GITHUB_OUTPUT"
          echo "Found tests in $(dirname "$file")"

      - name: Build tests
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            core_test.cpp -o core_test

      - name: Run tests
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./core_test

  # Builds the GTA San Andreas ASI (Win32, Release) with MSBuild.
  build:
    name: Build EarShot.asi (GTA SA, Win32)
    needs: core-tests
    runs-on: windows-2022
    env:
      PLUGIN_SDK_DIR: ${{ github.workspace }}\plugin-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Check project files
        shell: pwsh
        run: |
          if (-not (Test-Path 'SOURCE\repo\EarShot\EarShot.sln')) {
            Write-Error 'SOURCE\repo\EarShot\EarShot.sln not found. The repository root must contain the SOURCE folder.'
            Get-ChildItem -Recurse -Depth 3 | Select-Object -ExpandProperty FullName
            exit 1
          }

      - name: Fetch Plugin-SDK
        shell: pwsh
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git plugin-sdk

      - name: Verify Plugin-SDK library exists
        shell: pwsh
        run: |
          $lib = Join-Path $env:PLUGIN_SDK_DIR 'output\lib\plugin.lib'
          if (-not (Test-Path $lib)) {
            Write-Error "Plugin-SDK library not found: $lib. The project links plugin.lib from `$(PLUGIN_SDK_DIR)\output\lib. Build Plugin-SDK first or adjust this path."
            exit 1
          }
          Write-Host "Found $lib"

      - uses: microsoft/setup-msbuild@v2

      - name: Choose platform toolset
        id: toolset
        shell: pwsh
        run: |
          # The project uses v141_xp (Windows XP compatible). Hosted images do not always
          # ship that toolset, so fall back to v142 and say so in the log.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $found = $false
          if (Test-Path $vswhere) {
            $path = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.v141.x86.x64 Microsoft.VisualStudio.Component.WinXP `
              -property installationPath
            $found = [bool]$path
          }
          if ($found) {
            "override=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Using the project toolset (v141_xp)."
          } else {
            "override=/p:PlatformToolset=v142 /p:WindowsTargetPlatformVersion=10.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Warning "v141_xp is not installed on this runner. Building with v142: the output will not run on Windows XP."
          }

      - name: Build GTASA Release
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ steps.toolset.outputs.override }}') {
            $extra = '${{ steps.toolset.outputs.override }}'.Split(' ')
          }
          msbuild "SOURCE\repo\EarShot\EarShot.sln" "/p:Configuration=GTASA Release" "/p:Platform=Win32" /m /nologo /v:minimal @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect output
        id: collect
        shell: pwsh
        run: |
          $dist = 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $asi = Get-ChildItem 'SOURCE\release\EarShot' -Filter 'EarShot.asi' -ErrorAction Stop
          Copy-Item $asi.FullName $dist

          # EarShot needs irrKlang.dll at runtime. It is not stored in this repository
          # because it is distributed by its author. Put it at this path to include it.
          $dll = 'SOURCE\repo\EarShot\EarShot\include\irrKlang-1.6.0\bin\win32-visualStudio\irrKlang.dll'
          if (Test-Path $dll) {
            Copy-Item $dll $dist
          } else {
            Write-Warning 'irrKlang.dll was not found. Copy it next to EarShot.asi in the game folder before running.'
          }
          Get-ChildItem $dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: EarShot-GTASA
          path: dist/*
          if-no-files-found: error

  # Publishes the build as a GitHub Release when a version tag (v1.2.3) is pushed.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EarShot-GTASA
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          zip -r "../EarShot-${GITHUB_REF_NAME}-GTASA.zip" .
          cd ..
          gh release create "$GITHUB_REF_NAME" "EarShot-${GITHUB_REF_NAME}-GTASA.zip" \
            --title "EarShot ${GITHUB_REF_NAME}" --generate-notes
