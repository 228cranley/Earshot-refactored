name: Build EarShot

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tests
        working-directory: SOURCE/repo/EarShot/EarShot/tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -g -fsanitize=address,undefined -fno-sanitize-recover=all core_test.cpp -o core_test
      - name: Run tests
        working-directory: SOURCE/repo/EarShot/EarShot/tests
        run: ./core_test

  build:
    name: Build EarShot.asi (GTA SA Win32)
    needs: core-tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Fetch Plugin-SDK
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git SOURCE/repo/EarShot/plugin-sdk
          git -C SOURCE/repo/EarShot/plugin-sdk rev-parse HEAD

      - name: Generate Plugin-SDK solution
        shell: pwsh
        working-directory: SOURCE/repo/EarShot/plugin-sdk
        env:
          PLUGIN_SDK_DIR: ${{ github.workspace }}\SOURCE\repo\EarShot\plugin-sdk
        run: |
          & .\tools\premake\premake5.exe vs2022 --file=.\tools\premake\premake5.lua
          if ($LASTEXITCODE -ne 0) { throw 'Premake failed to generate Plugin-SDK solution.' }

      - name: Build Plugin-SDK for GTA San Andreas
        shell: pwsh
        working-directory: SOURCE/repo/EarShot/plugin-sdk
        env:
          PLUGIN_SDK_DIR: ${{ github.workspace }}\SOURCE\repo\EarShot\plugin-sdk
        run: |
          msbuild .\plugin.sln /m /nologo /verbosity:minimal /property:Configuration=Release '/property:Platform=Mixed Platforms' /target:Plugin_SA /property:PlatformToolset=v143 /property:WindowsTargetPlatformVersion=10.0
          if ($LASTEXITCODE -ne 0) { throw 'Plugin-SDK build failed.' }
          if (-not (Test-Path '.\output\lib\Plugin.lib')) { throw 'Plugin.lib was not created.' }

      - name: Build EarShot Release
        shell: pwsh
        run: |
          msbuild 'SOURCE\repo\EarShot\EarShot.sln' /m /nologo /verbosity:minimal '/property:Configuration=GTASA Release' '/property:Platform=x86' /property:PlatformToolset=v143 /property:WindowsTargetPlatformVersion=10.0
          if ($LASTEXITCODE -ne 0) { throw 'EarShot build failed.' }
          if (-not (Test-Path 'SOURCE\release\EarShot\EarShot.asi')) { throw 'EarShot.asi was not created.' }

      - name: Prepare release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'SOURCE\release\EarShot\EarShot.asi' dist\EarShot.asi
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: EarShot-GTASA-Win32
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EarShot-GTASA-Win32
          path: dist
      - name: Package release
        run: cd dist && zip -r "../EarShot-${GITHUB_REF_NAME}-GTASA-Win32.zip" .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "EarShot-${GITHUB_REF_NAME}-GTASA-Win32.zip" --title "EarShot ${GITHUB_REF_NAME}" --generate-notes
